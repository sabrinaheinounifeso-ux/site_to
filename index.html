<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DirecionaTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  @property --rot { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

  :root{
    --paper:#F1EDE3;
    --paper-2:#E8E2D3;
    --ink:#211F1B;
    --ink-soft:#6B665C;
    --line: rgba(33,31,27,0.12);
    --da: #1F5C34;
    --da-soft:#E3ECE3;
    --toca:#2A1B3D;
    --toca-lime:#C9962F;
    --toca-soft:#EAE4EF;
    --coord:#C7368D;
    --coord-soft:#F5E2ED;
    --gold:#D9A441;
    --font-display:'Bricolage Grotesque', system-ui, sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(33,31,27,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:860px;margin:0 auto;padding:28px 20px 80px;}
  h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
  .mono{font-family:var(--font-mono);}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:2.5px solid var(--gold);outline-offset:3px;border-radius:4px;}

  /* ---------- header ---------- */
  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:34px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;flex:none;}
  .brand h1{font-size:22px;font-weight:700;}
  .brand-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .admin-link{font-size:12px;color:var(--ink-soft);text-decoration:none;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,0.4);transition:all .15s;}
  .admin-link:hover{border-color:var(--ink);color:var(--ink);}

  /* ---------- signpost ---------- */
  .signpost-wrap{display:flex;justify-content:center;margin:6px 0 6px;}
  .arm{transform-origin:150px 100px;transition:transform .5s ease, opacity .5s ease, filter .5s ease;}
  @keyframes swayDA{0%,100%{transform:rotate(-11deg);}50%{transform:rotate(-6deg);}}
  @keyframes swayToca{0%,100%{transform:rotate(1deg);}50%{transform:rotate(6deg);}}
  @keyframes swayCoord{0%,100%{transform:rotate(11deg);}50%{transform:rotate(15deg);}}
  #arm-da{animation:swayDA 4.2s ease-in-out infinite;}
  #arm-toca{animation:swayToca 3.6s ease-in-out infinite .3s;}
  #arm-coordenacao{animation:swayCoord 4.6s ease-in-out infinite .6s;}
  .arm-label{font-family:var(--font-mono);font-size:9px;letter-spacing:.04em;}
  @media (prefers-reduced-motion: reduce){
    .arm{animation:none !important;}
  }

  /* ---------- hero card ---------- */
  .hero-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    padding:36px 30px;
    box-shadow: 0 1px 0 rgba(33,31,27,0.03);
  }
  .hero-card h2{font-size:clamp(24px,4vw,32px);font-weight:700;margin-bottom:8px;}
  .hero-card p.lead{color:var(--ink-soft);font-size:15px;margin:0 0 22px;line-height:1.5;}
  textarea{
    width:100%;
    min-height:110px;
    resize:vertical;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:16px;
    font-family:var(--font-body);
    font-size:15.5px;
    line-height:1.5;
    color:var(--ink);
    background:var(--paper);
    transition:border-color .15s;
  }
  textarea::placeholder{color:#9c968a;}
  textarea:focus{border-color:var(--ink);outline:none;}

  .btn-primary{
    margin-top:16px;
    width:100%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:14px;
    padding:15px 20px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    letter-spacing:.02em;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s ease, box-shadow .2s ease, background .2s;
  }
  .btn-primary:hover{box-shadow:0 0 0 4px rgba(217,164,65,0.35);}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{opacity:.55;cursor:default;}
  .btn-primary:disabled:hover{box-shadow:none;}

  .btn-secondary{
    background:transparent;border:1.5px solid var(--line);color:var(--ink);
    border-radius:12px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:border-color .15s, background .15s;
  }
  .btn-secondary:hover{border-color:var(--ink);background:rgba(0,0,0,0.02);}

  .legend{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;}
  .legend-chip{font-size:11.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:20px;padding:5px 11px;display:flex;align-items:center;gap:5px;}

  /* ---------- chips (clarify) ---------- */
  .chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;}
  @media (max-width:520px){.chip-grid{grid-template-columns:1fr;}}
  .chip{
    text-align:left;
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:13px;
    padding:12px 14px;
    font-size:14px;
    font-weight:500;
    display:flex;align-items:center;gap:9px;
    cursor:pointer;
    transition:border-color .15s, transform .1s, background .15s;
  }
  .chip:hover{border-color:var(--ink);background:var(--paper);}
  .chip:active{transform:scale(0.98);}
  .clarify-msg{font-size:15.5px;line-height:1.55;margin:2px 0 4px;}

  /* ---------- result screen ---------- */
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 10px;border-radius:20px;font-weight:500;
  }
  .badge-primary{background:var(--gold);color:var(--ink);}
  .badge-secondary{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}

  .dest-card{
    position:relative;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:4px 22px 22px 4px;
    padding:28px 32px 28px 26px;
    margin-bottom:18px;
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%);
  }
  .dest-card.primary{border-left:6px solid var(--accent);}
  .dest-card.secondary{opacity:.92;padding-right:44px;}
  .dest-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .dest-emoji{font-size:34px;line-height:1;flex:none;}
  .dest-logo{width:52px;height:52px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,0.15);}
  .legend-logo{width:16px;height:16px;border-radius:50%;object-fit:cover;flex:none;}
  .admin-logo{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;vertical-align:middle;}
  .dest-name{font-size:19px;font-weight:700;font-family:var(--font-display);}
  .dest-role{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}

  .section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 6px;}
  .why-text{font-size:14.5px;line-height:1.55;color:var(--ink);}
  .steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;}
  .steps li{font-size:14.5px;line-height:1.5;display:flex;gap:8px;}
  .steps li .arrow{color:var(--accent);font-weight:700;flex:none;}

  .contact-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px;
    margin-top:6px;
  }
  .contact-row{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line);}
  .contact-row:last-child{border-bottom:none;}
  .contact-row .lbl{color:var(--ink-soft);width:112px;flex:none;font-size:11.5px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em;}
  .contact-row .val{font-family:var(--font-mono);font-size:13px;word-break:break-word;}
  .contact-missing{color:#a39c8d;font-style:italic;font-family:var(--font-body);}

  .actions-row{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;}

  /* ---------- admin ---------- */
  .admin-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:18px;}
  .admin-card h3{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field textarea{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
    font-family:var(--font-body);font-size:14px;background:var(--paper);color:var(--ink);
  }
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--ink);}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:560px){.field-grid{grid-template-columns:1fr;}}
  .save-row{display:flex;align-items:center;gap:12px;margin-top:6px;}
  .saved-note{font-size:12.5px;color:#2E7D4F;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .3s;}
  .saved-note.show{opacity:1;}

  .login-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px;max-width:360px;margin:40px auto 0;text-align:center;}
  .login-card input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;margin:16px 0;text-align:center;background:var(--paper);}
  .error-text{color:#B23A3A;font-size:13px;margin-top:6px;}

  .fade-in{animation:fadeIn .45s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   DirecionaTO — client-side prototype
   ---------------------------------------------------------------------
   This build simulates, entirely in the browser, the two pieces the
   real spec calls out as backend concerns:

   1) SUPABASE  -> entity contact data is kept in window.storage
      (shared = true), seeded from the SQL insert in the brief. Swap
      loadEntities()/saveEntities() for real Supabase calls when you
      wire up a project — the shape (slug/name/instagram/whatsapp/
      email/location/business_hours) matches the given schema exactly.

   2) OPENAI/GEMINI ROUTING -> classify() below is a rule-based stand-in
      for the LLM call described in the system prompt. It returns the
      *exact same JSON schema* the real prompt asks for, so you can
      replace the body of classify() with a fetch() to your serverless
      function without touching any UI code.
   ===================================================================== */

const VAGUE_PATTERNS = [
  /^tenho um problema\.?$/i, /^ajuda\.?$/i, /^n[ãa]o sei\.?$/i, /^preciso de ajuda\.?$/i,
  /^to com (um )?problema\.?$/i, /^estou com (um )?problema\.?$/i, /^d[uú]vida\.?$/i,
  /^oi\.?$/i, /^ol[aá]\.?$/i, /^help\.?$/i,
];

function scoreText(text){
  const t = text.toLowerCase();
  const scores = { da:0, toca:0, coordenacao:0 };
  for(const key of Object.keys(KEYWORDS)){
    for(const kw of KEYWORDS[key]){
      if(t.includes(kw)) scores[key] += 1;
    }
  }
  return scores;
}

function classify(text){
  const trimmed = text.trim();
  const wordCount = trimmed.split(/\s+/).filter(Boolean).length;

  if(!trimmed || VAGUE_PATTERNS.some(r=>r.test(trimmed)) || wordCount < 3){
    return { isVague:true, isOutOfScope:false, vagueMessage:"Posso te ajudar a encontrar o caminho. Me conta um pouco mais: o que aconteceu?", primaryEntity:null, primaryReason:null, nextSteps:null, secondaryEntity:null, secondaryReason:null };
  }

  const scores = scoreText(trimmed);
  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const [topKey, topScore] = sorted[0];
  const [secondKey, secondScore] = sorted[1];

  if(topScore === 0){
    return { isVague:false, isOutOfScope:true, vagueMessage:null, primaryEntity:null, primaryReason:null, nextSteps:null, secondaryEntity:null, secondaryReason:null };
  }

  const REASONS = {
    da: "Isso envolve um conflito ou uma demanda coletiva — o DA existe pra representar vocês nesse tipo de situação.",
    toca: "Isso é sobre integração e vida estudantil — a área que a TOCA cuida e adora.",
    coordenacao: "Isso é um procedimento oficial do curso, então a Coordenação é quem tem a informação certa.",
  };
  const STEPS = {
    da: ["Reúna datas, prints ou nomes envolvidos, se houver.", "Chama o DA pelo Instagram ou e-mail com um resumo curto.", "Se for uma demanda coletiva, veja se mais colegas passam pela mesma coisa."],
    toca: ["Dá um alô pra TOCA contando a ideia ou o que você quer fazer.", "Se for evento, já pensa numa data e num formato (mesmo que provisório).", "Fica de olho no Instagram deles pra ver os próximos passos."],
    coordenacao: ["Confere se já existe um edital ou norma sobre isso no site do curso.", "Manda um e-mail ou passa na Coordenação no horário de atendimento.", "Leva RA e documentos que possam ser pedidos."],
  };

  const result = {
    isVague:false, isOutOfScope:false, vagueMessage:null,
    primaryEntity: topKey,
    primaryReason: REASONS[topKey],
    nextSteps: STEPS[topKey],
    secondaryEntity: null, secondaryReason: null,
  };

  if(secondScore > 0 && secondScore >= topScore - 1 && secondKey){
    result.secondaryEntity = secondKey;
    result.secondaryReason = secondKey === 'coordenacao'
      ? "Depois de resolver isso, também vale confirmar o procedimento oficial com a Coordenação."
      : (secondKey === 'da'
        ? "Se sentir que isso também fere um direito de vocês, o DA pode entrar como apoio."
        : "Isso também tem uma cara de integração — vale contar pra TOCA também.");
  }

  return result;
}

    da: "Isso envolve um conflito ou uma demanda coletiva — o DA existe pra representar vocês nesse tipo de situação.",
    toca: "Isso é sobre integração e vida estudantil — a área que a TOCA cuida e adora.",
    coordenacao: "Isso é um procedimento ou uma informação oficial do curso, então a Coordenação é quem tem a resposta certa.",
  };
  const STEPS = {
    da: ["Reúna datas, prints ou nomes envolvidos, se houver.", "Chama o DA pelo Instagram ou e-mail com um resumo curto.", "Se for uma demanda coletiva, veja se mais colegas passam pela mesma coisa."],
    toca: ["Dá um alô pra TOCA contando a ideia ou o que você quer fazer.", "Se for evento ou produto, já pensa numa data ou formato (mesmo que provisório).", "Fica de olho no Instagram deles pra ver os próximos passos."],
    coordenacao: ["Confere se já existe um edital ou norma sobre isso no site do curso.", "Manda um e-mail ou passa na Coordenação no horário de atendimento.", "Leva RA e documentos que possam ser pedidos."],
  };

  const cfg = MAP[chipKey];
  const result = {
    isVague:false, isOutOfScope:false, vagueMessage:null,
    primaryEntity: cfg.primaryEntity,
    primaryReason: REASONS[cfg.primaryEntity],
    nextSteps: STEPS[cfg.primaryEntity],
    secondaryEntity: cfg.secondaryEntity || null,
    secondaryReason: cfg.secondaryEntity ? (cfg.secondaryEntity === 'da'
      ? "Se quiser apoio institucional pra tirar a ideia do papel, o DA também pode ajudar."
      : "Depois de resolver isso, também vale confirmar o procedimento oficial com a Coordenação.") : null,
  };
  return result;
}

const SUPPORT_WHATSAPP = '5521988873999';
const SUPPORT_WHATSAPP_DISPLAY = '(21) 98887-3999';

const CHIPS = [
  { key:'academica', emoji:'📚', label:'Questão acadêmica' },
  { key:'professor', emoji:'👩‍🏫', label:'Professor ou disciplina' },
  { key:'problema', emoji:'🏛️', label:'Problema ou reivindicação' },
  { key:'coordenacao', emoji:'🎓', label:'Informação da Coordenação' },
  { key:'evento', emoji:'🐊', label:'Evento ou festa' },
  { key:'esporte', emoji:'🏆', label:'Esporte' },
  { key:'passeio', emoji:'✈️', label:'Passeio ou viagem' },
  { key:'integracao', emoji:'🤝', label:'Integração' },
  { key:'ideia', emoji:'💡', label:'Tenho uma ideia' },
  { key:'divulgar', emoji:'📣', label:'Quero divulgar alguma coisa' },
];

/* ---------------- rendering ---------------- */
const app = document.getElementById('app');

function icons(){ try{ lucide.createIcons(); }catch(e){} }

function signpostSVG(pointing){
  const highlight = pointing || null;
  function armStyle(key, dim){
    if(!highlight) return '';
    if(key === highlight) return 'style="animation:none;transform:rotate(0deg) scale(1.14);opacity:1;filter:none;"';
    return 'style="animation:none;transform:rotate(0deg) translateX(4px) scale(0.86);opacity:.28;filter:grayscale(1);"';
  }
  return `
  <svg class="signpost-wrap" width="220" height="230" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <clipPath id="clip-da"><circle cx="188" cy="100" r="15"/></clipPath>
      <clipPath id="clip-toca"><circle cx="189" cy="150" r="15"/></clipPath>
      <clipPath id="clip-coordenacao"><circle cx="188" cy="200" r="15"/></clipPath>
    </defs>
    <line x1="150" y1="90" x2="150" y2="272" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <circle cx="150" cy="278" r="9" fill="var(--ink)" opacity="0.85"/>

    <g id="arm-da" class="arm" ${armStyle('da')}>
      <path d="M150 92 L262 78 L280 92 L262 106 L150 106 Z" fill="var(--da)"/>
      <image href="${LOGO.da}" x="173" y="85" width="30" height="30" clip-path="url(#clip-da)" preserveAspectRatio="xMidYMid slice"/>
      <text class="arm-label" x="225" y="100" fill="#fff" text-anchor="middle" dominant-baseline="middle">DATO</text>
    </g>

    <g id="arm-toca" class="arm" ${armStyle('toca')}>
      <path d="M150 142 L268 128 L286 142 L268 156 L150 156 Z" fill="var(--toca)"/>
      <image href="${LOGO.toca}" x="174" y="135" width="30" height="30" clip-path="url(#clip-toca)" preserveAspectRatio="xMidYMid slice"/>
      <text class="arm-label" x="231" y="150" fill="#fff" text-anchor="middle" dominant-baseline="middle">TOCA</text>
    </g>

    <g id="arm-coordenacao" class="arm" ${armStyle('coordenacao')}>
      <path d="M150 192 L258 178 L276 192 L258 206 L150 206 Z" fill="var(--coord)"/>
      <image href="${LOGO.coordenacao}" x="173" y="185" width="30" height="30" clip-path="url(#clip-coordenacao)" preserveAspectRatio="xMidYMid slice"/>
      <text class="arm-label" x="222" y="200" fill="#fff" text-anchor="middle" dominant-baseline="middle">COORD.</text>
    </g>
  </svg>`;
}

function topbar(){
  return `
  <div class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><line x1="20" y1="6" x2="20" y2="35" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><path d="M20 10 L34 7 L38 10 L34 13 L20 13 Z" fill="var(--gold)"/><path d="M20 18 L8 15 L4 18 L8 21 L20 21 Z" fill="var(--toca)"/></svg>
      <div>
        <h1>DirecionaTO</h1>
        <div class="brand-sub">Guia Estudantil de Terapia Ocupacional</div>
      </div>
    </div>
    <a href="#/admin" class="admin-link"><i data-lucide="lock" style="width:13px;height:13px;"></i> Admin</a>
  </div>`;
}

function legend(){
  return `
  <div class="legend">
    <span class="legend-chip"><img class="legend-logo" src="${LOGO.da}" alt="" /> DATO — representa</span>
    <span class="legend-chip"><img class="legend-logo" src="${LOGO.toca}" alt="" /> TOCA — conecta</span>
    <span class="legend-chip"><img class="legend-logo" src="${LOGO.coordenacao}" alt="" /> Coordenação — orienta</span>
  </div>`;
}

function renderHome(){
  app.innerHTML = `
    ${topbar()}
    ${signpostSVG(null)}
    <div class="hero-card fade-in">
      <h2>O que está acontecendo?</h2>
      <p class="lead">Conte sua dúvida, problema ou ideia. A gente te ajuda a encontrar o caminho.</p>
      <textarea id="query-input" placeholder="Ex: Estou com problema em uma disciplina / Quero organizar um campeonato / Como funciona o estágio?"></textarea>
      <button class="btn-primary" id="submit-btn"><i data-lucide="compass" style="width:17px;height:17px;"></i> ENCONTRAR O CAMINHO</button>
      ${legend()}
    </div>
  `;
  icons();
  const ta = document.getElementById('query-input');
  const btn = document.getElementById('submit-btn');
  ta.value = lastQuery || '';
  ta.focus();
  btn.addEventListener('click', ()=>handleSubmit(ta.value));
  ta.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) handleSubmit(ta.value); });
}

function handleSubmit(text){
  lastQuery = text;
  const result = classify(text);
  if(result.isVague){ renderClarify(result); }
  else if(result.isOutOfScope){ renderOutOfScope(); }
  else { renderResult(result); }
}

function renderClarify(result){
  app.innerHTML = `
    ${topbar()}
    ${signpostSVG(null)}
    <div class="hero-card fade-in">
      <h2 style="font-size:22px;">🧭 Vamos por partes</h2>
      <p class="clarify-msg">${result.vagueMessage}</p>
      <div class="chip-grid">
        ${CHIPS.map(c=>`<button class="chip" data-chip="${c.key}"><span>${c.emoji}</span><span>${c.label}</span></button>`).join('')}
      </div>
      <div style="margin-top:22px;"><button class="btn-secondary" id="back-btn"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Voltar</button></div>
    </div>
  `;
  icons();
  document.getElementById('back-btn').addEventListener('click', renderHome);
  document.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.getAttribute('data-chip');
      renderResult(classifyFromChip(key));
    });
  });
}

function renderOutOfScope(){
  const waLink = `https://wa.me/${SUPPORT_WHATSAPP}?text=${encodeURIComponent('Oi Sabrina! Usei o DirecionaTO e não encontrei um caminho pra minha dúvida: "' + lastQuery + '"')}`;
  app.innerHTML = `
    ${topbar()}
    ${signpostSVG(null)}
    <div class="hero-card fade-in">
      <h2 style="font-size:22px;">🤔 Essa fugiu do nosso mapa</h2>
      <p class="clarify-msg">Isso aqui não parece ser sobre DATO, TOCA ou Coordenação — pode ser algo mais específico, ou o app ainda não sabe reconhecer esse tipo de pedido. Chama a Sabrina, que cuida do DirecionaTO, no WhatsApp, que ela te ajuda direto ou ajusta o sistema.</p>
      <a class="btn-primary" style="text-decoration:none;" href="${waLink}" target="_blank" rel="noopener">
        <i data-lucide="message-circle" style="width:17px;height:17px;"></i> Chamar Sabrina no WhatsApp
      </a>
      <p style="font-size:12.5px;color:var(--ink-soft);text-align:center;margin-top:10px;">${SUPPORT_WHATSAPP_DISPLAY}</p>
      <div style="margin-top:10px;"><button class="btn-secondary" id="back-btn-oos"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Tentar de novo</button></div>
    </div>
  `;
  icons();
  document.getElementById('back-btn-oos').addEventListener('click', ()=>{ lastQuery=''; renderHome(); });
}

function destCardHTML(entityKey, reason, steps, isPrimary){
  const meta = ENTITY_META[entityKey];
  const data = entities[entityKey];
  return `
  <div class="dest-card ${isPrimary?'primary':'secondary'} fade-in" style="--accent:${meta.accent};">
    <span class="badge ${isPrimary?'badge-primary':'badge-secondary'}">${isPrimary?'Caminho Principal':'Também considere'}</span>
    <div class="dest-head" style="margin-top:12px;">
      <img class="dest-logo" src="${meta.img}" alt="${meta.short}" />
      <div>
        <div class="dest-name">${data.name || meta.name}</div>
        <div class="dest-role">${data.role_definition || ''}</div>
      </div>
    </div>

    <div class="section-label">Por quê?</div>
    <div class="why-text">${reason}</div>

    ${isPrimary ? `
    <div class="section-label">O que fazer agora?</div>
    <ul class="steps">${steps.map(s=>`<li><span class="arrow">→</span><span>${s}</span></li>`).join('')}</ul>

    <div class="section-label">Contato</div>
    <div class="contact-card">
      ${contactRow('Instagram', data.instagram)}
      ${contactRow('WhatsApp', data.whatsapp)}
      ${contactRow('E-mail', data.email)}
      ${contactRow('Local', data.location)}
      ${contactRow('Horário', data.business_hours)}
    </div>
    ` : ''}
  </div>`;
}

function contactRow(label, value){
  const has = value && String(value).trim().length > 0;
  return `<div class="contact-row"><span class="lbl">${label}</span><span class="val ${has?'':'contact-missing'}">${has ? escapeHTML(value) : 'Informação de contato não cadastrada no momento.'}</span></div>`;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderResult(result){
  app.innerHTML = `
    ${topbar()}
    ${signpostSVG(result.primaryEntity)}
    <div class="fade-in">
      ${destCardHTML(result.primaryEntity, result.primaryReason, result.nextSteps, true)}
      ${result.secondaryEntity ? destCardHTML(result.secondaryEntity, result.secondaryReason, [], false) : ''}
      <div class="actions-row">
        <button class="btn-secondary" id="new-question"><i data-lucide="rotate-ccw" style="width:14px;height:14px;"></i> Nova pergunta</button>
      </div>
    </div>
  `;
  icons();
  document.getElementById('new-question').addEventListener('click', ()=>{ lastQuery=''; renderHome(); });
}

/* ---------------- admin ---------------- */
let adminAuthed = false;
const ADMIN_PASSWORD = 'to2026';

function renderAdminLogin(){
  app.innerHTML = `
    ${topbar()}
    <div class="login-card fade-in">
      <i data-lucide="shield" style="width:26px;height:26px;color:var(--ink-soft);"></i>
      <h2 style="font-size:19px;margin-top:10px;">Painel Admin</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:6px;">Acesso restrito para DA, TOCA e Coordenação.</p>
      <input type="password" id="admin-pass" placeholder="Senha de acesso" />
      <div id="admin-error" class="error-text"></div>
      <button class="btn-primary" id="admin-login-btn" style="margin-top:4px;">Entrar</button>
      <div style="margin-top:14px;"><a href="#/" style="font-size:12.5px;color:var(--ink-soft);">← Voltar ao início</a></div>
    </div>
  `;
  icons();
  const input = document.getElementById('admin-pass');
  input.focus();
  const tryLogin = ()=>{
    if(input.value === ADMIN_PASSWORD){ adminAuthed = true; renderAdmin(); }
    else { document.getElementById('admin-error').textContent = 'Senha incorreta. Tente novamente.'; }
  };
  document.getElementById('admin-login-btn').addEventListener('click', tryLogin);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
}

function adminFieldsHTML(key){
  const d = entities[key];
  const meta = ENTITY_META[key];
  return `
  <div class="admin-card fade-in">
    <h3><img class="admin-logo" src="${meta.img}" alt="" /> ${d.name}</h3>
    <div class="field"><label>Nome</label><input data-k="${key}" data-f="name" value="${escapeHTML(d.name)}"/></div>
    <div class="field"><label>Descrição / Papel</label><input data-k="${key}" data-f="role_definition" value="${escapeHTML(d.role_definition)}"/></div>
    <div class="field-grid">
      <div class="field"><label>Responsáveis</label><input data-k="${key}" data-f="responsible_names" value="${escapeHTML(d.responsible_names||'')}"/></div>
      <div class="field"><label>Instagram</label><input data-k="${key}" data-f="instagram" value="${escapeHTML(d.instagram||'')}"/></div>
      <div class="field"><label>WhatsApp</label><input data-k="${key}" data-f="whatsapp" value="${escapeHTML(d.whatsapp||'')}"/></div>
      <div class="field"><label>E-mail</label><input data-k="${key}" data-f="email" value="${escapeHTML(d.email||'')}"/></div>
      <div class="field"><label>Localização</label><input data-k="${key}" data-f="location" value="${escapeHTML(d.location||'')}"/></div>
      <div class="field"><label>Horário de atendimento</label><input data-k="${key}" data-f="business_hours" value="${escapeHTML(d.business_hours||'')}"/></div>
    </div>
  </div>`;
}

function renderAdmin(){
  if(!adminAuthed){ renderAdminLogin(); return; }
  app.innerHTML = `
    ${topbar()}
    <div class="fade-in" style="margin-bottom:6px;">
      <h2 style="font-size:22px;margin-bottom:4px;">Painel Admin</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:20px;">Edite as informações de contato de cada entidade. Essas informações são as que aparecem no card de contato do resultado.</p>
    </div>
    ${adminFieldsHTML('da')}
    ${adminFieldsHTML('toca')}
    ${adminFieldsHTML('coordenacao')}
    <div class="save-row">
      <button class="btn-primary" id="save-btn" style="width:auto;padding:14px 26px;">
        <i data-lucide="save" style="width:16px;height:16px;"></i> Salvar alterações
      </button>
      <span class="saved-note" id="saved-note"><i data-lucide="check" style="width:13px;height:13px;"></i> Salvo</span>
      <a href="#/" style="margin-left:auto;font-size:12.5px;color:var(--ink-soft);">Sair do admin</a>
    </div>
  `;
  icons();
  document.querySelectorAll('.field input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const k = inp.getAttribute('data-k'), f = inp.getAttribute('data-f');
      entities[k][f] = inp.value;
    });
  });
  document.getElementById('save-btn').addEventListener('click', async ()=>{
    const ok = await saveEntities();
    const note = document.getElementById('saved-note');
    if(ok){ note.classList.add('show'); setTimeout(()=>note.classList.remove('show'), 1800); }
  });
}

/* ---------------- router ---------------- */
function router(){
  route = window.location.hash || '#/';
  if(route.startsWith('#/admin')) renderAdmin();
  else renderHome();
}
window.addEventListener('hashchange', router);

(async function init(){
  app.innerHTML = `<div style="padding:60px;text-align:center;color:var(--ink-soft);font-size:13px;">Carregando…</div>`;
  await loadEntities();
  router();
})();
</script>
</body>
</html>
